version: "3.8"

services:
  # ------------------------------------------------------------------
  # Kafka
  # ------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_KRAFT_CLUSTER_ID: "QkU3OEVBNTcwNTJENDM4Q2"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "1"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cdc-net

  # ------------------------------------------------------------------
  # PostgreSQL — источник данных для CDC
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    # wal_level=logical и резерв слотов/отправителей репликации необходимы
    # Debezium для логического декодирования изменений (плагин pgoutput,
    # встроен в PostgreSQL с версии 10 — отдельно ставить не нужно).
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cdc-net

  # ------------------------------------------------------------------
  # Kafka Connect + Debezium PostgreSQL Connector + JMX-экспортёр
  # ------------------------------------------------------------------
  kafka-connect:
    build: ./connect
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"  # REST API Kafka Connect
      - "8081:8081"  # /metrics для Prometheus (JMX exporter)
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: "connect_configs"
      OFFSET_STORAGE_TOPIC: "connect_offsets"
      STATUS_STORAGE_TOPIC: "connect_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      # Подключаем javaagent JMX-экспортёра (собран в connect/Dockerfile),
      # порт 8081 отдаёт метрики в формате Prometheus по пути /metrics.
      KAFKA_OPTS: "-javaagent:/kafka/etc/jmx_prometheus_javaagent.jar=8081:/kafka/etc/jmx-exporter-config.yml"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - cdc-net

  # Однократно регистрирует Debezium-коннектор через REST API, как
  # только Kafka Connect готов, и завершает работу.
  connect-init:
    image: curlimages/curl:8.9.1
    container_name: connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./connector-config:/connector-config:ro
      - ./scripts/register-connector.sh:/register-connector.sh:ro
    entrypoint: ["/bin/sh", "/register-connector.sh"]
    environment:
      CONNECT_URL: "http://kafka-connect:8083"
      CONFIG_FILE: "/connector-config/postgres-connector.json"
    networks:
      - cdc-net

  # ------------------------------------------------------------------
  # Python-консьюмер: читает CDC-топики и печатает события в терминал
  # ------------------------------------------------------------------
  cdc-consumer:
    build: ./consumer
    container_name: cdc-consumer
    depends_on:
      kafka:
        condition: service_healthy
      connect-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPICS: "dbserver1.public.users,dbserver1.public.orders"
    networks:
      - cdc-net

  # ------------------------------------------------------------------
  # Мониторинг: Prometheus + Grafana (Задание 2)
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - kafka-connect
    networks:
      - cdc-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/files
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cdc-net

networks:
  cdc-net:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
  grafana-data:
